<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LED Art Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; margin: 2em; background: #181a1b; color: #eee; }
        .panel { background: #23272a; padding: 2em; border-radius: 1em; max-width: 600px; margin: auto; }
        h1 { text-align: center; }
        label { display: block; margin-top: 1em; }
        select, button, input[type=color], input[type=number], input[type=text] { margin-top: 0.5em; width: 100%; padding: 0.5em; border-radius: 0.5em; border: none; }
        .actions { display: flex; gap: 1em; margin-top: 1em; }
        .actions button { flex: 1; }
        .desc { font-size: 0.95em; color: #b0b0b0; margin-bottom: 1em; }
        .settings { margin-top: 2em; background: #202225; padding: 1em; border-radius: 0.5em; }
        .tabs { display: flex; margin-bottom: 1em; }
        .tab { flex: 1; padding: 1em; background: #202225; color: #eee; text-align: center; cursor: pointer; border-radius: 0.5em 0.5em 0 0; }
        .tab.active { background: #2c2f33; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .progress-bar-bg { background: #444; border-radius: 0.5em; height: 1.2em; margin: 0.5em 0; }
        .progress-bar { background: #4e9cff; height: 100%; border-radius: 0.5em; transition: width 0.3s; }
        .status-row { display: flex; justify-content: space-between; }
        .playground-section { margin-top: 2em; }
        .feedback { margin-top: 1em; color: #ffb347; font-size: 1em; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>LED Art Control</h1>
        <div class="tabs">
            <div class="tab active" id="tabShow" onclick="showTab('show')">Show Control</div>
            <div class="tab" id="tabPlayground" onclick="showTab('playground')">Playground</div>
            <div class="tab" id="tabEditor" onclick="showTab('editor')">Editor</div>
        </div>
        <div class="tab-content active" id="showTabContent">
            <div id="statusDisplay">
                <div class="status-row">
                    <span><b>Now:</b> <span id="currentEffect">Idle</span></span>
                    <span id="progressText"></span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progressBar" style="width:0%"></div>
                </div>
            </div>
            <div style="margin-top:0.5em; background:#000; border-radius:0.5em; padding:0.4em;">
                <canvas id="ledPreview" width="576" height="32" style="width:100%; height:32px; display:block; image-rendering:pixelated;"></canvas>
            </div>
            <div id="stepInfoPanel" class="desc" style="min-height:2em; margin-top:0.5em; background:#202225; border-radius:0.5em; padding:1em;"></div>
            <label for="sceneSelect">Available Shows:</label>
            <select id="sceneSelect"></select>
            <div class="desc" id="sceneDesc"></div>
            <div class="actions">
                <button onclick="playScene()">Play</button>
                <button id="pauseBtn" onclick="togglePause()">Pause</button>
                <button onclick="stopScene()">Stop</button>
                <button onclick="refreshScenes()">Refresh</button>
            </div>
            <label for="playlistSelect">Playlists:</label>
            <select id="playlistSelect"><option value="">(none available)</option></select>
            <div class="desc" id="playlistDesc"></div>
            <div class="actions">
                <button onclick="playPlaylist()">Play Playlist</button>
            </div>
            <div class="settings">
                <label for="brightnessSlider">Brightness: <span id="brightnessValue">31</span> / 31</label>
                <input type="range" id="brightnessSlider" min="0" max="31" value="31" style="width:100%;">
                <label for="speedSelect">Speed</label>
                <select id="speedSelect">
                    <option value="0.25">0.25x (very slow)</option>
                    <option value="0.5">0.5x (slow)</option>
                    <option value="1" selected>1x (normal)</option>
                    <option value="2">2x (fast)</option>
                    <option value="4">4x (very fast)</option>
                </select>
            </div>
            <label for="colorPicker">Quick Color:</label>
            <div style="display:flex; gap:0.5em; align-items:center;">
                <input type="color" id="colorPicker" style="flex:1;">
                <select id="turrellColorDropdown" style="flex:2;"></select>
            </div>
            <button onclick="sendColor()">Set Color</button>
            <div class="actions">
                <button onclick="turnOff()">Turn Off LEDs</button>
                <button onclick="exitServer()">Exit</button>
            </div>
            <div class="actions">
                <button onclick="showHelp('effects')">Help: Effects</button>
                <button onclick="showHelp('transitions')">Help: Transitions</button>
            </div>
        </div>
        <div class="tab-content" id="playgroundTabContent">
            <h2>Effect & Transition Playground</h2>
            <div class="playground-section">
                <label for="effectDropdown">Effect:</label>
                <select id="effectDropdown"></select>
                <form id="effectForm"></form>
                <div class="feedback" id="effectFeedback"></div>
            </div>
        </div>
        <div class="tab-content" id="editorTabContent">
            <h2>Scene Editor</h2>
            <label>Filename (must end in .json)</label>
            <input type="text" id="edFilename" placeholder="my_show.json">
            <label>Name</label>
            <input type="text" id="edName" placeholder="My Show">
            <label>Description</label>
            <input type="text" id="edDescription">
            <label>Narrative intro (optional)</label>
            <input type="text" id="edNarrativeIntro">
            <label>Repeat (1, or 0 / "forever" for endless)</label>
            <input type="text" id="edRepeat" value="1">
            <h3 style="margin-top:1.2em;">Steps</h3>
            <div id="edStepsList"></div>
            <div class="actions">
                <button onclick="edAddStep()">+ Add Step</button>
            </div>
            <div class="actions">
                <button onclick="edPreview()">Preview (don't save)</button>
                <button onclick="edSave(false)">Save</button>
                <button onclick="edSave(true)">Save (overwrite)</button>
            </div>
            <div class="feedback" id="edFeedback"></div>
        </div>
    </div>
    <!-- Add modal for help -->
    <div id="helpModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#23272a; color:#eee; padding:2em; border-radius:1em; max-width:500px; margin:auto; position:relative;">
            <button onclick="closeHelp()" style="position:absolute; top:1em; right:1em; background:#444; color:#fff; border:none; border-radius:0.5em; padding:0.3em 0.7em;">X</button>
            <div id="helpContent"></div>
        </div>
    </div>
    <script>
        let scenes = [];
        let effects = [
            {name: 'solid', params: ['color', 'duration']},
            {name: 'gradient', params: ['color_start', 'color_end', 'duration']},
            {name: 'breathing', params: ['base_color', 'cycle_s', 'duration']},
            {name: 'pulse', params: ['color', 'speed', 'width_px', 'duration']},
            {name: 'strobe', params: ['color', 'duty_cycle', 'tempo', 'duration']},
            {name: 'chase', params: ['color', 'speed', 'duration']},
            {name: 'rainbow', params: ['duration', 'speed']},
            {name: 'twinkle', params: ['color', 'rate', 'decay', 'duration']},
            {name: 'comet', params: ['color', 'speed', 'tail_px', 'duration']},
            {name: 'fire', params: ['duration', 'intensity']},
            {name: 'theater_chase', params: ['color', 'gap', 'speed', 'duration']}
        ];
        const NUMERIC_PARAM_HINTS = ['duration','speed','cycle','width','step','min_b','max_b','jitter','rate','decay','tail','gap','intensity','tempo','duty','wavelength'];
        function isNumberParam(name) {
            return NUMERIC_PARAM_HINTS.some(h => name.includes(h));
        }
        let turrellColors = [];
        function showTab(tab) {
            document.getElementById('showTabContent').classList.toggle('active', tab==='show');
            document.getElementById('playgroundTabContent').classList.toggle('active', tab==='playground');
            document.getElementById('editorTabContent').classList.toggle('active', tab==='editor');
            document.getElementById('tabShow').classList.toggle('active', tab==='show');
            document.getElementById('tabPlayground').classList.toggle('active', tab==='playground');
            document.getElementById('tabEditor').classList.toggle('active', tab==='editor');
        }
        function loadScenes() {
            fetch('/scenes').then(r => r.json()).then(data => {
                scenes = data;
                const sel = document.getElementById('sceneSelect');
                sel.innerHTML = '';
                data.forEach((scene, i) => {
                    const opt = document.createElement('option');
                    opt.value = scene.filename;
                    opt.textContent = scene.name;
                    sel.appendChild(opt);
                });
                showDesc();
            });
        }
        function showDesc() {
            const sel = document.getElementById('sceneSelect');
            const idx = sel.selectedIndex;
            const sc = scenes[idx];
            const desc = document.getElementById('sceneDesc');
            if (!sc) { desc.textContent = ''; return; }
            let html = sc.description || '';
            if (sc.warnings && sc.warnings.length) {
                html += `<div style="color:#ffb347; margin-top:0.3em;">⚠ ${sc.warnings.join('; ')}</div>`;
            }
            desc.innerHTML = html;
        }
        function playScene() {
            const sel = document.getElementById('sceneSelect');
            const filename = sel.value;
            fetch('/apply_scene_file', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename })
            });
        }
        let playlists = [];
        function loadPlaylists() {
            fetch('/playlists').then(r => r.json()).then(data => {
                playlists = data;
                const sel = document.getElementById('playlistSelect');
                sel.innerHTML = '';
                if (!data.length) {
                    const opt = document.createElement('option');
                    opt.value = ''; opt.textContent = '(none available)';
                    sel.appendChild(opt);
                } else {
                    data.forEach(pl => {
                        const opt = document.createElement('option');
                        opt.value = pl.filename;
                        opt.textContent = `${pl.name} (${pl.item_count} scenes)`;
                        sel.appendChild(opt);
                    });
                }
                showPlaylistDesc();
            });
        }
        function showPlaylistDesc() {
            const sel = document.getElementById('playlistSelect');
            const pl = playlists[sel.selectedIndex] || null;
            const desc = document.getElementById('playlistDesc');
            if (!pl) { desc.textContent = ''; return; }
            let html = pl.description || '';
            if (pl.warnings && pl.warnings.length) {
                html += `<div style="color:#ffb347; margin-top:0.3em;">⚠ ${pl.warnings.join('; ')}</div>`;
            }
            desc.innerHTML = html;
        }
        function playPlaylist() {
            const sel = document.getElementById('playlistSelect');
            if (!sel.value) return;
            fetch('/apply_playlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: sel.value })
            });
        }
        function stopScene() {
            fetch('/stop', { method: 'POST' });
        }
        let isPaused = false;
        function togglePause() {
            const url = isPaused ? '/resume' : '/pause';
            fetch(url, { method: 'POST' });
        }
        function setBrightness(value) {
            fetch('/brightness', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: parseInt(value, 10) })
            });
        }
        function setSpeed(value) {
            fetch('/speed', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: parseFloat(value) })
            });
        }
        function refreshScenes() { loadScenes(); }
        function loadTurrellColors() {
            fetch('/static/turrell_colors.json').then(r => r.json()).then(data => {
                turrellColors = data;
                const sel = document.getElementById('turrellColorDropdown');
                sel.innerHTML = '';
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify(c.color);
                    opt.textContent = c.name;
                    sel.appendChild(opt);
                });
                sel.onchange = function() {
                    const rgb = JSON.parse(sel.value);
                    document.getElementById('colorPicker').value = rgbToHex(rgb);
                };
            });
        }
        function rgbToHex(rgb) {
            return '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
        }
        function hexToRgb(hex) {
            hex = hex.replace('#','');
            return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];
        }
        function sendColor() {
            const color = document.getElementById('colorPicker').value;
            const r = parseInt(color.substr(1,2), 16);
            const g = parseInt(color.substr(3,2), 16);
            const b = parseInt(color.substr(5,2), 16);
            fetch('/set_color', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ color: [r, g, b] })
            });
        }
        function turnOff() {
            fetch('/off', { method: 'POST' });
        }
        function exitServer() {
            fetch('/exit', { method: 'POST' });
        }
        function applyStatus(s) {
            const label = s.paused ? 'Paused'
                        : s.current_effect ? `${s.current_effect} (${s.current_transition})`
                        : s.running ? 'Running...' : 'Idle';
            document.getElementById('currentEffect').textContent = label;
            let pct = 0;
            if (s.running && s.total_steps > 0) {
                pct = Math.round(100 * (s.step - 1) / s.total_steps);
            }
            document.getElementById('progressBar').style.width = pct + '%';
            let text = '';
            if (s.running) {
                text = `Step ${s.step}/${s.total_steps} | Elapsed: ${s.elapsed}s`;
                if (s.duration) text += ` / ~${s.duration}s`;
            }
            document.getElementById('progressText').textContent = text;
            // Pause button label tracks server state
            isPaused = !!s.paused;
            document.getElementById('pauseBtn').textContent = isPaused ? 'Resume' : 'Pause';
            // Brightness + speed (only update slider/select if user isn't dragging)
            const brightnessSlider = document.getElementById('brightnessSlider');
            if (s.brightness != null && document.activeElement !== brightnessSlider) {
                brightnessSlider.value = s.brightness;
                document.getElementById('brightnessValue').textContent = s.brightness;
            }
            const speedSel = document.getElementById('speedSelect');
            if (s.speed != null && document.activeElement !== speedSel) {
                speedSel.value = String(s.speed);
            }
            let info = '';
            if (s.running) {
                if (s.playlist) {
                    info += `<div style='margin-bottom:0.4em; color:#c4a3ff;'><b>Playlist:</b> ${s.playlist} — scene ${s.playlist_step}/${s.playlist_total}</div>`;
                }
                if (s.narrative_intro) {
                    info += `<div style='margin-bottom:0.6em; color:#9ad1ff;'><i>${s.narrative_intro}</i></div>`;
                }
                info += `<b>Scene:</b> ${s.scene || ''}<br>`;
                info += `<b>Step:</b> ${s.step || 1}<br>`;
                info += `<b>Effect:</b> ${s.current_effect || ''}<br>`;
                info += `<b>Transition:</b> ${s.current_transition || ''}<br>`;
                if (s.step_params) {
                    info += `<b>Parameters:</b><ul style='margin:0 0 0 1em;'>`;
                    for (const [k, v] of Object.entries(s.step_params)) {
                        info += `<li><b>${k}</b>: ${JSON.stringify(v)}</li>`;
                    }
                    info += `</ul>`;
                }
                if (s.narrative) {
                    info += `<b>Narrative:</b> <i>${s.narrative}</i>`;
                }
            } else {
                info = '<i>Idle</i>';
            }
            document.getElementById('stepInfoPanel').innerHTML = info;
        }
        function startStatusStream() {
            if (!('EventSource' in window)) {
                setInterval(() => fetch('/status').then(r => r.json()).then(applyStatus), 1000);
                return;
            }
            const es = new EventSource('/status_stream');
            es.onmessage = ev => { try { applyStatus(JSON.parse(ev.data)); } catch (e) {} };
            es.onerror = () => { /* EventSource auto-reconnects */ };
        }
        function startPixelStream() {
            const canvas = document.getElementById('ledPreview');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            function draw(pixels) {
                const W = canvas.width, H = canvas.height;
                const w = W / pixels.length;
                for (let i = 0; i < pixels.length; i++) {
                    const p = pixels[i] || [0,0,0];
                    ctx.fillStyle = `rgb(${p[0]|0},${p[1]|0},${p[2]|0})`;
                    ctx.fillRect(Math.floor(i * w), 0, Math.ceil(w), H);
                }
            }
            if (!('EventSource' in window)) {
                setInterval(() => fetch('/pixels').then(r => r.json()).then(draw), 200);
                return;
            }
            const es = new EventSource('/pixels_stream');
            es.onmessage = ev => { try { draw(JSON.parse(ev.data)); } catch (e) {} };
            es.onerror = () => {};
        }
        // Playground
        function renderEffectDropdown() {
            const sel = document.getElementById('effectDropdown');
            sel.innerHTML = '';
            effects.forEach(eff => {
                const opt = document.createElement('option');
                opt.value = eff.name;
                opt.textContent = eff.name;
                sel.appendChild(opt);
            });
            sel.onchange = renderEffectForm;
            renderEffectForm();
        }
        function renderEffectForm() {
            const sel = document.getElementById('effectDropdown');
            const eff = effects.find(e => e.name === sel.value);
            const form = document.getElementById('effectForm');
            form.innerHTML = '';
            if (!eff) return;
            eff.params.forEach(param => {
                const label = document.createElement('label');
                label.textContent = param;
                form.appendChild(label);
                if (param.includes('color')) {
                    const colorDiv = document.createElement('div');
                    colorDiv.style.display = 'flex';
                    colorDiv.style.gap = '0.5em';
                    colorDiv.style.alignItems = 'center';
                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';
                    colorInput.value = '#ffffff';
                    colorInput.style.flex = '1';
                    colorInput.id = param + '_picker';
                    const colorSel = document.createElement('select');
                    colorSel.style.flex = '2';
                    turrellColors.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = JSON.stringify(c.color);
                        opt.textContent = c.name;
                        colorSel.appendChild(opt);
                    });
                    colorSel.onchange = function() {
                        const rgb = JSON.parse(colorSel.value);
                        colorInput.value = rgbToHex(rgb);
                    };
                    colorDiv.appendChild(colorInput);
                    colorDiv.appendChild(colorSel);
                    form.appendChild(colorDiv);
                } else {
                    let input = document.createElement('input');
                    if (isNumberParam(param)) {
                        input.type = 'number';
                        input.step = 'any';
                    } else {
                        input.type = 'text';
                    }
                    input.name = param;
                    form.appendChild(input);
                }
            });
            const runBtn = document.createElement('button');
            runBtn.type = 'submit';
            runBtn.textContent = 'Run';
            form.appendChild(runBtn);
            form.onsubmit = function(e) {
                e.preventDefault();
                const params = {};
                eff.params.forEach(param => {
                    if (param.includes('color')) {
                        const colorVal = form.querySelector('#'+param+'_picker').value;
                        params[param] = hexToRgb(colorVal);
                    } else {
                        let val = form[param].value;
                        if (isNumberParam(param)) {
                            val = parseFloat(val);
                        }
                        params[param] = val;
                    }
                });
                document.getElementById('effectFeedback').textContent = 'Running...';
                fetch('/run_effect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ effect: eff.name, params })
                })
                .then(r => r.json())
                .then(resp => {
                    document.getElementById('effectFeedback').textContent = resp.status || resp.error || '';
                })
                .catch(() => {
                    document.getElementById('effectFeedback').textContent = 'Error running effect.';
                });
            };
        }
        document.getElementById('sceneSelect').addEventListener('change', showDesc);

        // ===== Scene Editor =====
        const TRANSITIONS = ['fade','instant','wave','middle-out','random_shimmer','patterned_fade','brightness_sweep','slide','dissolve'];
        let edSteps = [];
        function edAddStep() {
            edSteps.push({effect: 'solid', transition: 'fade', color: [80,120,255], duration: 5, transition_duration: 2, narrative: ''});
            edRender();
        }
        function edRemoveStep(i) { edSteps.splice(i, 1); edRender(); }
        function edMoveStep(i, dir) {
            const j = i + dir;
            if (j < 0 || j >= edSteps.length) return;
            [edSteps[i], edSteps[j]] = [edSteps[j], edSteps[i]];
            edRender();
        }
        function edDuplicateStep(i) {
            edSteps.splice(i + 1, 0, JSON.parse(JSON.stringify(edSteps[i])));
            edRender();
        }
        function edParamsForEffect(name) {
            return (effects.find(e => e.name === name) || {params:[]}).params;
        }
        function edRender() {
            const list = document.getElementById('edStepsList');
            list.innerHTML = '';
            edSteps.forEach((step, i) => {
                const card = document.createElement('div');
                card.style.cssText = 'background:#202225; padding:0.8em; margin-bottom:0.6em; border-radius:0.5em;';
                card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>Step ${i+1}</b>
                    <span>
                        <button type="button" onclick="edMoveStep(${i},-1)">↑</button>
                        <button type="button" onclick="edMoveStep(${i},1)">↓</button>
                        <button type="button" onclick="edDuplicateStep(${i})">Dup</button>
                        <button type="button" onclick="edRemoveStep(${i})" style="background:#5a2222;">×</button>
                    </span>
                </div>`;
                // Effect select
                const effLabel = document.createElement('label'); effLabel.textContent = 'Effect';
                const effSel = document.createElement('select');
                effects.forEach(e => {
                    const o = document.createElement('option'); o.value = e.name; o.textContent = e.name; effSel.appendChild(o);
                });
                effSel.value = step.effect;
                effSel.onchange = () => { step.effect = effSel.value; edRender(); };
                card.appendChild(effLabel); card.appendChild(effSel);
                // Transition select
                const trLabel = document.createElement('label'); trLabel.textContent = 'Transition';
                const trSel = document.createElement('select');
                TRANSITIONS.forEach(t => {
                    const o = document.createElement('option'); o.value = t; o.textContent = t; trSel.appendChild(o);
                });
                trSel.value = step.transition;
                trSel.onchange = () => { step.transition = trSel.value; };
                card.appendChild(trLabel); card.appendChild(trSel);
                // Effect-specific params
                edParamsForEffect(step.effect).forEach(param => {
                    const lbl = document.createElement('label'); lbl.textContent = param;
                    card.appendChild(lbl);
                    if (param.includes('color') || param === 'base_color') {
                        const cur = step[param] || [255,255,255];
                        const inp = document.createElement('input');
                        inp.type = 'color'; inp.value = rgbToHex(cur);
                        inp.oninput = () => { step[param] = hexToRgb(inp.value); };
                        card.appendChild(inp);
                    } else {
                        const inp = document.createElement('input');
                        inp.type = isNumberParam(param) ? 'number' : 'text';
                        if (inp.type === 'number') inp.step = 'any';
                        if (step[param] != null) inp.value = step[param];
                        inp.oninput = () => {
                            step[param] = inp.type === 'number' ? parseFloat(inp.value) : inp.value;
                        };
                        card.appendChild(inp);
                    }
                });
                // transition_duration
                const tdLbl = document.createElement('label'); tdLbl.textContent = 'transition_duration';
                const tdInp = document.createElement('input');
                tdInp.type = 'number'; tdInp.step = 'any'; tdInp.value = step.transition_duration ?? 2;
                tdInp.oninput = () => { step.transition_duration = parseFloat(tdInp.value); };
                card.appendChild(tdLbl); card.appendChild(tdInp);
                // narrative
                const nLbl = document.createElement('label'); nLbl.textContent = 'narrative (optional)';
                const nInp = document.createElement('input');
                nInp.type = 'text'; nInp.value = step.narrative || '';
                nInp.oninput = () => { step.narrative = nInp.value; };
                card.appendChild(nLbl); card.appendChild(nInp);

                list.appendChild(card);
            });
        }
        function edBuildScene() {
            const data = {
                name: document.getElementById('edName').value || 'Untitled',
                description: document.getElementById('edDescription').value || '',
                steps: edSteps.map(s => {
                    const out = { effect: s.effect, transition: s.transition,
                                  transition_duration: s.transition_duration ?? 2 };
                    edParamsForEffect(s.effect).forEach(p => {
                        if (s[p] != null && s[p] !== '') out[p] = s[p];
                    });
                    if (s.narrative) out.narrative = s.narrative;
                    return out;
                })
            };
            const intro = document.getElementById('edNarrativeIntro').value;
            if (intro) data.narrative_intro = intro;
            const rep = document.getElementById('edRepeat').value.trim();
            if (rep && rep !== '1') {
                data.repeat = (rep === 'forever' || rep === '0') ? 'forever' : parseInt(rep, 10);
            }
            return data;
        }
        function edFeedback(msg, color) {
            const el = document.getElementById('edFeedback');
            el.style.color = color || '#ffb347';
            el.textContent = msg;
        }
        function edPreview() {
            const data = edBuildScene();
            fetch('/apply_scene', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(r => r.json()).then(resp => {
                edFeedback(resp.status || resp.error || '', resp.error ? '#ff7373' : '#7dd87d');
            });
        }
        function edSave(overwrite) {
            const filename = document.getElementById('edFilename').value.trim();
            if (!filename.endsWith('.json')) {
                edFeedback('filename must end in .json'); return;
            }
            fetch('/save_scene', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename, data: edBuildScene(), overwrite })
            }).then(r => r.json().then(j => ({ status: r.status, body: j }))).then(({status, body}) => {
                if (status === 200) {
                    edFeedback(`saved ${body.filename}`, '#7dd87d');
                    loadScenes();
                } else if (body.exists) {
                    edFeedback('file exists — click "Save (overwrite)" to replace', '#ffb347');
                } else if (body.warnings) {
                    edFeedback('validation: ' + body.warnings.join('; '), '#ff7373');
                } else {
                    edFeedback(body.error || 'save failed', '#ff7373');
                }
            });
        }

        // Help modal logic
        function showHelp(type) {
            let html = '';
            if (type === 'effects') {
                html = `<h2>Effects</h2><ul>
                    <li><b>solid</b>: Show a single color for a set duration.</li>
                    <li><b>gradient</b>: Smoothly blend from one color to another across the strip.</li>
                    <li><b>breathing</b>: Sine-wave brightness pulsing of a color.</li>
                    <li><b>pulse</b>: A moving bright spot of color.</li>
                    <li><b>strobe</b>: Rapid flashing of a color.</li>
                    <li><b>chase</b>: A single moving pixel of color.</li>
                    <li><b>rainbow</b>: HSV cycle across the whole strip.</li>
                    <li><b>twinkle</b>: Random sparkles that decay.</li>
                    <li><b>comet</b>: Bright head with a fading tail.</li>
                    <li><b>fire</b>: Random flickering fire palette.</li>
                    <li><b>theater_chase</b>: Every Nth pixel lit; pattern advances.</li>
                </ul>`;
            } else if (type === 'transitions') {
                html = `<h2>Transitions</h2><ul>
                    <li><b>fade</b>: Cross-fade between colors.</li>
                    <li><b>instant</b>: No transition, hard cut.</li>
                    <li><b>wave</b>: Sinusoidal wave transition between colors.</li>
                    <li><b>middle-out</b>: Color radiates from the center outwards.</li>
                    <li><b>random_shimmer</b>: Adds noise during fade for a shimmering effect.</li>
                    <li><b>patterned_fade</b>: Steps through a palette of colors.</li>
                    <li><b>brightness_sweep</b>: Global brightness ramp up or down.</li>
                    <li><b>slide</b>: New color slides in from one end.</li>
                    <li><b>dissolve</b>: Pixels swap to the new color in random order.</li>
                </ul>`;
            }
            document.getElementById('helpContent').innerHTML = html;
            document.getElementById('helpModal').style.display = 'flex';
        }
        function closeHelp() {
            document.getElementById('helpModal').style.display = 'none';
        }
        window.onload = function() {
            loadScenes();
            loadPlaylists();
            loadTurrellColors();
            renderEffectDropdown();
            startStatusStream();
            startPixelStream();
            document.getElementById('playlistSelect').addEventListener('change', showPlaylistDesc);
            edAddStep();
            const bs = document.getElementById('brightnessSlider');
            bs.addEventListener('input', () => {
                document.getElementById('brightnessValue').textContent = bs.value;
            });
            bs.addEventListener('change', () => setBrightness(bs.value));
            document.getElementById('speedSelect').addEventListener('change', e => setSpeed(e.target.value));
        };
    </script>
</body>
</html>
