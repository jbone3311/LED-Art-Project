<!DOCTYPE html>
<html>
<head>
    <title>LED Strip Simulation</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        #title {
            text-align: center;
            padding: 10px;
            font-size: 24px;
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        #led-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #narrative {
            text-align: center;
            padding: 10px;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .led {
            position: absolute;
            border: 1px solid #1e1e1e;
            box-sizing: border-box;
        }
        
        .led-number {
            position: absolute;
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 1px black;
        }
        
        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        button {
            padding: 5px 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #444;
        }
        
        button.active {
            background-color: #666;
        }
        
        input[type="range"] {
            width: 100px;
        }
        
        label {
            color: white;
            font-size: 14px;
        }

        #open-window-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }

        #open-window-btn:hover {
            background-color: #45a049;
        }

        #open-window-btn.clicked {
            background-color: #2196F3;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 5px;
            font-size: 14px;
        }

        #show-controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1000;
        }
        
        #show-creator-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #9C27B0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }
        
        #show-creator-btn:hover {
            background-color: #7B1FA2;
        }
        
        #show-creator-btn.clicked {
            background-color: #6A1B9A;
        }
        
        .show-select {
            padding: 8px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            min-width: 200px;
        }
        
        .show-control-btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .show-control-btn:hover {
            background-color: #45a049;
        }
        
        .show-control-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        #show-creator-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            z-index: 2000;
        }
        
        .show-creator-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .show-creator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-btn {
            padding: 5px 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .show-creator-form {
            display: grid;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-weight: bold;
        }
        
        .form-group input, .form-group textarea {
            padding: 8px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .step-list {
            border: 1px solid #555;
            border-radius: 3px;
            padding: 10px;
        }
        
        .step-item {
            background-color: #333;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        
        .add-step-btn {
            padding: 8px 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .save-show-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="show-controls">
        <select id="show-select" class="show-select">
            <option value="">Select a show...</option>
        </select>
        <button id="play-btn" class="show-control-btn" disabled>Play</button>
        <button id="pause-btn" class="show-control-btn" disabled>Pause</button>
        <button id="stop-btn" class="show-control-btn" disabled>Stop</button>
    </div>
    
    <button id="show-creator-btn">Create Show</button>
    <button id="open-window-btn">Open LED Window</button>
    <div id="status">Status: Web Display Active</div>
    
    <div id="show-creator-panel">
        <div class="show-creator-content">
            <div class="show-creator-header">
                <h2>Create New Show</h2>
                <button class="close-btn">×</button>
            </div>
            <form id="show-creator-form" class="show-creator-form">
                <div class="form-group">
                    <label for="show-name">Show Name</label>
                    <input type="text" id="show-name" required>
                </div>
                <div class="form-group">
                    <label for="show-description">Description</label>
                    <textarea id="show-description"></textarea>
                </div>
                <div class="form-group">
                    <label>Steps</label>
                    <div id="step-list" class="step-list">
                        <!-- Steps will be added here -->
                    </div>
                    <button type="button" class="add-step-btn">Add Step</button>
                </div>
                <button type="submit" class="save-show-btn">Save Show</button>
            </form>
        </div>
    </div>
    
    <div id="title"></div>
    <div id="led-container"></div>
    <div id="narrative"></div>
    <div id="controls">
        <div class="control-group">
            <button data-shape="line">Line</button>
            <button data-shape="square">Square</button>
            <button data-shape="rectangle">Rectangle</button>
            <button data-shape="circle">Circle</button>
            <button data-shape="triangle">Triangle</button>
        </div>
        <div class="control-group">
            <label>Size:</label>
            <input type="range" id="pixel-size" min="1" max="40" value="20">
        </div>
        <div class="control-group">
            <label>Spacing:</label>
            <input type="range" id="pixel-spacing" min="0" max="10" value="2">
        </div>
        <div class="control-group">
            <label>Brightness:</label>
            <input type="range" id="brightness" min="0" max="31" value="31">
        </div>
        <div class="control-group">
            <label>Shape Size:</label>
            <input type="range" id="shape-size" min="20" max="80" value="70">
        </div>
        <div class="control-group">
            <label>Show Numbers:</label>
            <input type="checkbox" id="show-numbers">
        </div>
    </div>

    <script>
        class LEDDisplay {
            constructor() {
                this.container = document.getElementById('led-container');
                this.title = document.getElementById('title');
                this.narrative = document.getElementById('narrative');
                this.status = document.getElementById('status');
                this.leds = [];
                this.numLEDs = 144;
                this.shape = 'line';
                this.pixelSize = 20;
                this.pixelSpacing = 2;
                this.brightness = 31;
                this.shapeSize = 70;
                this.showNumbers = false;
                
                this.setupControls();
                this.createLEDs();
                this.updateLayout();
            }
            
            setupControls() {
                // Open window button
                const openBtn = document.getElementById('open-window-btn');
                openBtn.addEventListener('click', () => {
                    openBtn.classList.add('clicked');
                    fetch('/open_window', { method: 'POST' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'ok') {
                                this.status.textContent = 'Status: LED Window Opened';
                            }
                            setTimeout(() => openBtn.classList.remove('clicked'), 200);
                        });
                });
                
                // Shape buttons
                document.querySelectorAll('button[data-shape]').forEach(button => {
                    button.addEventListener('click', () => {
                        this.shape = button.dataset.shape;
                        document.querySelectorAll('button[data-shape]').forEach(b => b.classList.remove('active'));
                        button.classList.add('active');
                        this.updateLayout();
                    });
                });
                
                // Sliders
                document.getElementById('pixel-size').addEventListener('input', (e) => {
                    this.pixelSize = parseInt(e.target.value);
                    this.updateLayout();
                });
                
                document.getElementById('pixel-spacing').addEventListener('input', (e) => {
                    this.pixelSpacing = parseInt(e.target.value);
                    this.updateLayout();
                });
                
                document.getElementById('brightness').addEventListener('input', (e) => {
                    this.brightness = parseInt(e.target.value);
                    this.updateLEDs();
                });
                
                document.getElementById('shape-size').addEventListener('input', (e) => {
                    this.shapeSize = parseInt(e.target.value);
                    this.updateLayout();
                });
                
                // Checkbox
                document.getElementById('show-numbers').addEventListener('change', (e) => {
                    this.showNumbers = e.target.checked;
                    this.updateLEDs();
                });
            }
            
            createLEDs() {
                this.container.innerHTML = '';
                this.leds = [];
                
                for (let i = 0; i < this.numLEDs; i++) {
                    const led = document.createElement('div');
                    led.className = 'led';
                    led.style.width = `${this.pixelSize}px`;
                    led.style.height = `${this.pixelSize}px`;
                    
                    const number = document.createElement('div');
                    number.className = 'led-number';
                    number.textContent = i;
                    number.style.display = this.showNumbers ? 'block' : 'none';
                    
                    led.appendChild(number);
                    this.container.appendChild(led);
                    this.leds.push({ element: led, number });
                }
            }
            
            updateLayout() {
                const containerWidth = this.container.clientWidth;
                const containerHeight = this.container.clientHeight;
                const totalSize = this.pixelSize + this.pixelSpacing;
                const shapeSize = Math.min(containerWidth, containerHeight) * (this.shapeSize / 100);
                
                let positions = [];
                
                switch (this.shape) {
                    case 'line':
                        const spacing = shapeSize / (this.numLEDs - 1);
                        for (let i = 0; i < this.numLEDs; i++) {
                            positions.push({
                                x: (containerWidth - shapeSize) / 2 + i * spacing,
                                y: containerHeight / 2
                            });
                        }
                        break;
                        
                    case 'square':
                        const ledsPerSide = Math.ceil(this.numLEDs / 4);
                        const squareSpacing = shapeSize / (ledsPerSide - 1);
                        const startX = (containerWidth - shapeSize) / 2;
                        const startY = (containerHeight - shapeSize) / 2;
                        
                        // Top edge
                        for (let i = 0; i < ledsPerSide; i++) {
                            positions.push({
                                x: startX + i * squareSpacing,
                                y: startY
                            });
                        }
                        
                        // Right edge
                        for (let i = 0; i < ledsPerSide; i++) {
                            positions.push({
                                x: startX + shapeSize,
                                y: startY + i * squareSpacing
                            });
                        }
                        
                        // Bottom edge
                        for (let i = 0; i < ledsPerSide; i++) {
                            positions.push({
                                x: startX + shapeSize - i * squareSpacing,
                                y: startY + shapeSize
                            });
                        }
                        
                        // Left edge
                        for (let i = 0; i < ledsPerSide; i++) {
                            positions.push({
                                x: startX,
                                y: startY + shapeSize - i * squareSpacing
                            });
                        }
                        
                        // Trim to exact number of LEDs
                        positions = positions.slice(0, this.numLEDs);
                        break;
                        
                    // Add other shapes here...
                }
                
                // Update LED positions
                positions.forEach((pos, i) => {
                    if (i < this.leds.length) {
                        const led = this.leds[i];
                        led.element.style.left = `${pos.x - this.pixelSize / 2}px`;
                        led.element.style.top = `${pos.y - this.pixelSize / 2}px`;
                        led.number.style.left = `${this.pixelSize / 2}px`;
                        led.number.style.top = `${this.pixelSize / 2}px`;
                    }
                });
            }
            
            updateLEDs() {
                this.leds.forEach(led => {
                    led.number.style.display = this.showNumbers ? 'block' : 'none';
                });
            }
            
            setTitle(title) {
                this.title.textContent = title;
            }
            
            setNarrative(narrative) {
                this.narrative.textContent = narrative;
            }
            
            setPixel(index, r, g, b) {
                if (index >= 0 && index < this.leds.length) {
                    const brightness = this.brightness / 31;
                    const color = `rgb(${Math.round(r * brightness)}, ${Math.round(g * brightness)}, ${Math.round(b * brightness)})`;
                    this.leds[index].element.style.backgroundColor = color;
                }
            }
            
            setAllPixels(r, g, b) {
                const brightness = this.brightness / 31;
                const color = `rgb(${Math.round(r * brightness)}, ${Math.round(g * brightness)}, ${Math.round(b * brightness)})`;
                this.leds.forEach(led => {
                    led.element.style.backgroundColor = color;
                });
            }
        }

        // Show Controls
        class ShowControls {
            constructor() {
                this.showSelect = document.getElementById('show-select');
                this.playBtn = document.getElementById('play-btn');
                this.pauseBtn = document.getElementById('pause-btn');
                this.stopBtn = document.getElementById('stop-btn');
                this.showCreatorBtn = document.getElementById('show-creator-btn');
                this.showCreatorPanel = document.getElementById('show-creator-panel');
                this.closeBtn = document.querySelector('.close-btn');
                this.showCreatorForm = document.getElementById('show-creator-form');
                
                this.setupEventListeners();
                this.loadShows();
            }
            
            setupEventListeners() {
                this.showSelect.addEventListener('change', () => {
                    const hasSelection = this.showSelect.value !== '';
                    this.playBtn.disabled = !hasSelection;
                    this.pauseBtn.disabled = true;
                    this.stopBtn.disabled = true;
                });
                
                this.playBtn.addEventListener('click', () => {
                    this.playShow();
                });
                
                this.pauseBtn.addEventListener('click', () => {
                    this.pauseShow();
                });
                
                this.stopBtn.addEventListener('click', () => {
                    this.stopShow();
                });
                
                this.showCreatorBtn.addEventListener('click', () => {
                    this.showCreatorPanel.style.display = 'block';
                });
                
                this.closeBtn.addEventListener('click', () => {
                    this.showCreatorPanel.style.display = 'none';
                });
                
                this.showCreatorForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveShow();
                });
            }
            
            async loadShows() {
                try {
                    console.log('Loading shows...');
                    const response = await fetch('/scenes');
                    const shows = await response.json();
                    console.log('Loaded shows:', shows);
                    
                    this.showSelect.innerHTML = '<option value="">Select a show...</option>';
                    shows.forEach(show => {
                        const option = document.createElement('option');
                        option.value = show.filename;
                        option.textContent = show.name;
                        this.showSelect.appendChild(option);
                    });
                    
                    if (shows.length === 0) {
                        this.status.textContent = 'Status: No shows available';
                    }
                } catch (error) {
                    console.error('Error loading shows:', error);
                    this.status.textContent = `Error loading shows: ${error.message}`;
                }
            }
            
            async playShow() {
                if (!this.showSelect.value) return;
                
                try {
                    console.log('Playing show:', this.showSelect.value);
                    const response = await fetch('/apply_scene_file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: this.showSelect.value })
                    });
                    
                    const data = await response.json();
                    console.log('Server response:', data);
                    
                    if (response.ok) {
                        this.playBtn.disabled = true;
                        this.pauseBtn.disabled = false;
                        this.stopBtn.disabled = false;
                        this.status.textContent = `Status: Playing ${this.showSelect.options[this.showSelect.selectedIndex].text}`;
                    } else {
                        console.error('Error playing show:', data.error);
                        this.status.textContent = `Error: ${data.error}`;
                    }
                } catch (error) {
                    console.error('Error playing show:', error);
                    this.status.textContent = `Error: ${error.message}`;
                }
            }
            
            pauseShow() {
                // Implement pause functionality
                this.playBtn.disabled = false;
                this.pauseBtn.disabled = true;
            }
            
            stopShow() {
                // Implement stop functionality
                fetch('/off', { method: 'POST' });
                this.playBtn.disabled = false;
                this.pauseBtn.disabled = true;
                this.stopBtn.disabled = true;
            }
            
            async saveShow() {
                const showData = {
                    name: document.getElementById('show-name').value,
                    description: document.getElementById('show-description').value,
                    steps: [] // Add step data collection here
                };
                
                try {
                    const response = await fetch('/save_show', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(showData)
                    });
                    
                    if (response.ok) {
                        this.showCreatorPanel.style.display = 'none';
                        this.loadShows();
                    }
                } catch (error) {
                    console.error('Error saving show:', error);
                }
            }
        }
        
        // Initialize both displays
        const display = new LEDDisplay();
        const showControls = new ShowControls();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            display.updateLayout();
        });
        
        // WebSocket connection for real-time updates
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch (data.type) {
                case 'title':
                    display.setTitle(data.value);
                    break;
                    
                case 'narrative':
                    display.setNarrative(data.value);
                    break;
                    
                case 'pixel':
                    display.setPixel(data.index, data.r, data.g, data.b);
                    break;
                    
                case 'all_pixels':
                    display.setAllPixels(data.r, data.g, data.b);
                    break;
            }
        };
    </script>
</body>
</html>
